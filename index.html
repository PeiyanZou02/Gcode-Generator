<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G-Code Generator (Mobile/Desktop)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OpenCV.js -->
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Dark Mode Global */
        body { font-family: 'Roboto', sans-serif; background-color: #000000; color: #e8eaed; overflow: hidden; overscroll-behavior: none; }
        h1, h2, h3, button { font-family: 'Google Sans', sans-serif; }
        
        /* Dark Material Card */
        .card { background: #202124; border: 1px solid #3c4043; border-radius: 12px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; background: #000; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }

        /* Canvas Styles */
        #videoInput { display: none; }
        canvas.vision-canvas { width: 100%; height: auto; border-radius: 8px; background: #000; border: 1px solid #3c4043; }
        
        /* Inputs */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #8ab4f8; margin-top: -6px; cursor: pointer; border: 2px solid #202124; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #5f6368; border-radius: 2px; }
        
        input[type=number], select { background-color: #303134; color: #e8eaed; border: 1px solid #5f6368; }
        input[type=number]:focus, select:focus { border-color: #8ab4f8; outline: none; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
        
        #canvas3d { width: 100%; height: 100%; display: block; outline: none; }
        
        /* Pulse animation */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(242, 139, 130, 0); }
            100% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0); }
        }
        
        /* Glassmorphism for floating UI */
        .glass-panel {
            background: rgba(32, 33, 36, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Loading Screen -->
    <div id="loading" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <div class="text-xl font-medium text-gray-300">Vision Engine Initializing...</div>
        <div class="text-sm text-gray-500 mt-2">Loading OpenCV & Three.js</div>
    </div>

    <!-- Hidden File Input for Video Upload -->
    <input type="file" id="videoUploadInput" accept="video/*" class="hidden" onchange="handleVideoUpload(this)">

    <!-- Header (Responsive) -->
    <header class="bg-black border-b border-gray-800 h-14 md:h-16 flex items-center justify-between px-4 md:px-6 shrink-0 z-40 relative">
        <div class="flex items-center gap-2 md:gap-3">
            <h1 class="text-lg md:text-xl font-medium text-gray-200">G-Gen <span class="hidden md:inline">Code Generator</span> <span class="text-xs text-gray-500 ml-1 font-mono">BETA</span></h1>
        </div>
        
        <!-- Controls Area -->
        <div class="flex items-center gap-2">
            
            <!-- Mobile Quick Actions (Icons) -->
            <div class="flex md:hidden gap-1">
                <button onclick="document.getElementById('videoUploadInput').click()" class="p-2 text-gray-300 hover:text-white rounded-full active:bg-gray-800" title="Upload Video">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </button>
                <button onclick="resetApp()" class="p-2 text-gray-300 hover:text-red-400 rounded-full active:bg-gray-800" title="Reset">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>

            <!-- Desktop Controls -->
            <div class="hidden md:flex gap-3">
                <button id="startCamBtnDesktop" onclick="handleStartCamera()" class="bg-[#8ab4f8] hover:bg-[#aecbfa] text-[#202124] px-4 py-2 rounded-full text-sm font-medium transition-colors shadow-sm disabled:opacity-50 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Camera
                </button>
                <button onclick="document.getElementById('videoUploadInput').click()" class="border border-gray-600 hover:border-gray-400 text-gray-300 px-4 py-2 rounded-full text-sm font-medium transition-colors flex items-center gap-2">
                    Upload
                </button>
                <div class="w-px h-6 bg-gray-700 mx-1 self-center"></div>
                <button onclick="resetApp()" class="text-gray-400 hover:text-white px-3 py-2 rounded-full text-sm transition-colors" title="Reset">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button onclick="exportGcode()" class="bg-[#303134] border border-gray-600 hover:bg-[#3c4043] text-gray-200 px-4 py-2 rounded-full text-sm font-medium transition-colors flex items-center gap-2">
                    Export G-code
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container (Parent of all views) -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden relative w-full h-full">
        
        <!-- Live Status Overlay (Moved HERE so it floats over EVERYTHING) -->
        <div id="liveStatus" class="absolute top-4 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-4 py-2 flex items-center gap-3 hidden z-50 shadow-xl whitespace-nowrap pointer-events-none">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-[#f28b82] animate-pulse"></div>
                <span class="text-xs font-bold text-gray-200">SCANNING</span>
            </div>
            <div class="h-3 w-px bg-gray-500/50"></div>
            <div class="text-[10px] text-gray-300 font-mono">
                Z:<span id="currentZDisplay" class="text-white font-bold ml-1">0.0</span>
            </div>
            <div class="h-3 w-px bg-gray-500/50"></div>
            <div class="text-[10px] text-[#8ab4f8] font-mono" id="estTimeDisplay">00:00</div>
        </div>

        <!-- View 1: Vision & Settings (Sidebar) -->
        <aside id="sidebarPanel" class="w-full md:w-80 bg-black border-r border-gray-800 flex flex-col overflow-y-auto z-10 absolute md:relative inset-0 md:inset-auto bg-black transition-transform duration-300">
            <div class="p-4 md:p-5 space-y-4 md:space-y-6 pb-24 md:pb-5">
                
                <!-- Vision Preview Card -->
                <div class="card p-3 md:p-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-medium text-gray-400 text-xs uppercase tracking-wider">Vision Feed</h3>
                        <span class="text-[10px] text-[#8ab4f8] font-mono border border-[#8ab4f8]/30 px-1.5 py-0.5 rounded" id="statusBadge">IDLE</span>
                    </div>
                    <div class="relative aspect-video bg-black rounded border border-gray-700 overflow-hidden group">
                        <video id="videoInput" class="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-screen" muted playsinline></video>
                        <canvas id="canvasOutput" class="vision-canvas relative z-10"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" id="camPlaceholder">
                            <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center mb-2">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </div>
                            <span class="text-gray-600 text-xs font-mono">NO SIGNAL</span>
                        </div>
                    </div>
                    
                    <!-- Controls -->
                    <div class="space-y-4 pt-2">
                         <div class="flex gap-2">
                             <div class="w-1/2">
                                <label class="text-[10px] text-gray-500 mb-1 block">MODE</label>
                                <select id="generationMode" class="w-full bg-[#303134] text-gray-200 border border-gray-600 rounded p-1.5 text-sm outline-none">
                                    <option value="CYLINDER">Vase Mode</option>
                                    <option value="SHAPE">Shape Scan</option>
                                </select>
                             </div>
                             <div class="w-1/2">
                                <label class="text-[10px] text-gray-500 mb-1 block">TEXTURE DEPTH</label>
                                <input type="range" id="textureDepth" min="0" max="10" step="0.1" value="5.0">
                             </div>
                        </div>

                        <div class="border-t border-gray-700 pt-3">
                            <label class="text-[10px] text-gray-500 mb-1 block">EDGE THRESHOLDS (Canny)</label>
                            <div class="space-y-2">
                                <input type="range" id="threshold1" min="0" max="255" value="50">
                                <input type="range" id="threshold2" min="0" max="255" value="150">
                            </div>
                        </div>
                    </div>
                    
                    <button id="toggleScanBtn" class="w-full bg-[#303134] text-[#8ab4f8] hover:bg-[#3c4043] border border-gray-600 py-3 rounded-lg text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed flex justify-center items-center gap-2" disabled>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>START BUILD</span>
                    </button>
                    
                    <!-- Mobile only camera start button for convenience -->
                    <button id="startCamBtnMobile" onclick="handleStartCamera()" class="md:hidden w-full bg-[#8ab4f8] text-[#202124] hover:bg-[#aecbfa] py-3 rounded-lg text-sm font-medium flex justify-center items-center gap-2 mt-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span>OPEN CAMERA</span>
                    </button>
                </div>

                <!-- Print Settings (Compact Grid) -->
                <div class="card p-4">
                     <h3 class="font-medium text-gray-400 text-xs uppercase tracking-wider mb-3">Printer Params</h3>
                     <div class="grid grid-cols-3 gap-3">
                        <div class="space-y-1">
                            <label class="text-[9px] text-gray-500 uppercase">Bed (mm)</label>
                            <input type="number" id="targetWidth" value="220" onchange="updateSceneDimensions()" class="w-full bg-[#303134] border border-gray-600 rounded px-1 py-1 text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-gray-500 uppercase">Nozzle</label>
                            <select id="nozzleDia" class="w-full bg-[#303134] text-gray-200 border border-gray-600 rounded px-1 py-1 text-sm">
                                <option value="0.4">0.4</option>
                                <option value="0.8">0.8</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-gray-500 uppercase">Layer</label>
                            <input type="number" id="layerHeight" value="0.2" step="0.05" class="w-full bg-[#303134] border border-gray-600 rounded px-1 py-1 text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-gray-500 uppercase">Max H</label>
                            <input type="number" id="modelHeight" value="200" onchange="updateSceneDimensions()" class="w-full bg-[#303134] border border-gray-600 rounded px-1 py-1 text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-gray-500 uppercase">Speed</label>
                            <input type="number" id="printSpeed" value="1500" class="w-full bg-[#303134] border border-gray-600 rounded px-1 py-1 text-sm">
                        </div>
                        <div class="flex items-center pt-4">
                             <label class="flex items-center gap-1.5 text-[10px] text-gray-300">
                                <input type="checkbox" id="genBase" checked class="rounded border-gray-600 bg-[#303134] accent-blue-500"> Base
                            </label>
                        </div>
                     </div>
                     <div class="hidden">
                        <!-- Hidden inputs for logic continuity -->
                        <input type="number" id="filDia" value="1.75">
                        <input type="number" id="flowRatio" value="1.5">
                        <input type="number" id="scanSpeed" value="100">
                        <input type="checkbox" id="showBounds" checked>
                     </div>
                </div>
                
                <!-- Spacer for mobile scroll -->
                <div class="h-10 md:hidden"></div>
            </div>
        </aside>

        <!-- View 2: 3D Visualization (Main Panel) -->
        <main id="mainPanel" class="flex-1 relative bg-black w-full h-full md:block hidden z-0">
            <div id="canvas3d-container" class="absolute inset-0"></div>
            
            <!-- Fit View Button -->
             <button onclick="fitView()" class="absolute bottom-24 right-4 md:bottom-6 md:right-6 bg-[#202124] border border-gray-700 p-2 rounded-full text-[#8ab4f8] shadow-lg z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
             </button>
            
            <!-- Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 pointer-events-none">
                 <p class="text-sm font-mono opacity-50">3D PREVIEW AREA</p>
            </div>
        </main>

        <!-- Mobile Bottom Tab Bar -->
        <div class="md:hidden absolute bottom-0 left-0 w-full h-16 bg-[#202124] border-t border-gray-800 flex justify-around items-center z-40">
            <button onclick="switchTab('vision')" id="tabVision" class="flex flex-col items-center gap-1 text-[#8ab4f8] w-full h-full justify-center transition-colors duration-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <span class="text-[10px] font-medium tracking-wide">SCANNER</span>
            </button>
            <div class="w-px h-8 bg-gray-700"></div>
            <button onclick="exportGcode()" class="flex flex-col items-center gap-1 text-green-400 w-full h-full justify-center active:bg-gray-800 transition-colors duration-200">
                 <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                 <span class="text-[10px] font-medium tracking-wide">EXPORT</span>
            </button>
            <div class="w-px h-8 bg-gray-700"></div>
            <button onclick="switchTab('3d')" id="tab3d" class="flex flex-col items-center gap-1 text-gray-500 w-full h-full justify-center transition-colors duration-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">3D VIEW</span>
            </button>
        </div>
    </div>

<script>
    // --- Mobile Interface Logic ---
    function switchTab(tab) {
        const sidebar = document.getElementById('sidebarPanel');
        const main = document.getElementById('mainPanel');
        const btnVision = document.getElementById('tabVision');
        const btn3d = document.getElementById('tab3d');

        if(tab === 'vision') {
            sidebar.classList.remove('hidden');
            main.classList.add('hidden');
            
            btnVision.classList.add('text-[#8ab4f8]');
            btnVision.classList.remove('text-gray-500');
            btn3d.classList.remove('text-[#8ab4f8]');
            btn3d.classList.add('text-gray-500');
        } else {
            sidebar.classList.add('hidden');
            main.classList.remove('hidden');
            // Trigger resize to fix Three.js canvas size when showing
            onWindowResize();
            
            btn3d.classList.add('text-[#8ab4f8]');
            btn3d.classList.remove('text-gray-500');
            btnVision.classList.remove('text-[#8ab4f8]');
            btnVision.classList.add('text-gray-500');
        }
    }

    // --- Global Variables ---
    let stream = null;
    let cvReady = false;
    let video = document.getElementById('videoInput');
    let toggleScanBtn = document.getElementById('toggleScanBtn');
    let streaming = false;
    let isVideoFile = false;

    // Scanning State
    let isScanning = false;
    let scanIntervalId = null;
    let currentZ = 0;
    let currentLayer = 0;
    let consecutiveEmptyLayers = 0; 
    const EMPTY_LAYER_THRESHOLD = 50; 
    let gcodeMoves = []; 
    let lastValidPolygon = null; 
    let baseGenerated = false; 
    
    // Estimates
    let totalTimeSeconds = 0;
    let totalFilamentMM = 0;
    
    // Three.js Dynamic Geometry Buffers
    const MAX_POINTS = 1000000;
    let linePositions, lineColors;
    let drawCount = 0;

    // OpenCV objects
    let src = null, dst = null, cap = null, contours = null, hierarchy = null;

    // Three.js objects
    let scene, camera, renderer, controls;
    let livePrintMesh; 
    let nozzleMesh;
    let boundsBox; 
    let gridHelper;
    
    // UI Elements
    const sliderT1 = document.getElementById('threshold1');
    const sliderT2 = document.getElementById('threshold2');
    const sliderTex = document.getElementById('textureDepth');
    const modeSelect = document.getElementById('generationMode');
    const statusBadge = document.getElementById('statusBadge');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const liveStatus = document.getElementById('liveStatus');
    const zDisplay = document.getElementById('currentZDisplay');
    const estTimeDisplay = document.getElementById('estTimeDisplay');

    // --- Initialization ---

    function onOpenCvReady() {
        console.log('OpenCV Ready');
        document.getElementById('loading').style.display = 'none';
        cvReady = true;
        // Enable buttons
        if(document.getElementById('startCamBtnDesktop')) {
            document.getElementById('startCamBtnDesktop').disabled = false;
        }
        initThreeJS();
    }

    // --- Vision Logic ---

    // Unified Camera Start Function
    function handleStartCamera() {
        if (streaming && !isVideoFile) {
            stopInput();
        } else {
            stopInput();
            startCamera();
        }
    }

    window.handleVideoUpload = function(input) {
        if (input.files && input.files[0]) {
            stopInput();
            const file = input.files[0];
            const url = URL.createObjectURL(file);
            video.src = url;
            video.loop = false; 
            
            streaming = true;
            isVideoFile = true;
            
            enableUI(true);
            statusBadge.innerText = "VIDEO";
            
            video.oncanplay = function() {
                video.oncanplay = null; 
                setTimeout(() => {
                    if(!streaming) return;
                    initCvObjects();
                    // Auto-switch to vision tab on upload so user sees the "Scanning" process
                    if(window.innerWidth < 768) {
                        switchTab('vision');
                    }
                    // Auto start scanning logic
                    startScanning();
                }, 500); 
            };
            
            video.onended = function() {
                if(isScanning) stopScanning();
            };

            video.play().catch(e => console.error("Video play failed:", e));
        }
        input.value = '';
    }

    function startCamera() {
        const constraints = {
            audio: false,
            video: {
                facingMode: 'environment', // Prefer back camera on mobile
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(s) {
                stream = s;
                video.srcObject = stream;
                video.play();
                streaming = true;
                isVideoFile = false;

                enableUI(true);
                updateStartButtons(true);
                
                statusBadge.innerText = "LIVE";
                statusBadge.classList.replace('text-[#8ab4f8]', 'text-[#81c995]');
                statusBadge.classList.replace('border-[#8ab4f8]/30', 'border-[#81c995]/30');
                
                video.oncanplay = function() { 
                    video.oncanplay = null;
                    setTimeout(initCvObjects, 500); 
                };
            })
            .catch(function(err) {
                console.error("Camera Error:", err);
                alert("无法访问摄像头。请检查权限或尝试使用HTTPS。");
            });
    }

    function updateStartButtons(isRecording) {
        const deskBtn = document.getElementById('startCamBtnDesktop');
        const mobBtn = document.getElementById('startCamBtnMobile');
        
        if(deskBtn) {
            deskBtn.innerHTML = isRecording ? `Stop` : `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> Camera`;
            if(isRecording) {
                 deskBtn.classList.replace('bg-[#8ab4f8]', 'bg-red-400');
            } else {
                 deskBtn.classList.replace('bg-red-400', 'bg-[#8ab4f8]');
            }
        }
        if(mobBtn) {
            mobBtn.innerHTML = isRecording ? `<span>STOP CAMERA</span>` : `<span>OPEN CAMERA</span>`;
            if(isRecording) {
                 mobBtn.classList.replace('bg-[#8ab4f8]', 'bg-red-500');
                 mobBtn.classList.replace('text-[#202124]', 'text-white');
            } else {
                 mobBtn.classList.replace('bg-red-500', 'bg-[#8ab4f8]');
                 mobBtn.classList.replace('text-white', 'text-[#202124]');
            }
        }
    }

    function stopInput() {
        if(isScanning) stopScanning();

        if (!streaming) return;
        streaming = false;
        video.pause();
        if(stream) { stream.getTracks().forEach(track => track.stop()); stream = null; video.srcObject = null; }
        if(video.src) { URL.revokeObjectURL(video.src); video.src = ""; }
        
        // SAFE CLEANUP
        if(src) { try{src.delete();}catch(e){} src = null; }
        if(dst) { try{dst.delete();}catch(e){} dst = null; }
        if(contours) { try{contours.delete();}catch(e){} contours = null; }
        if(hierarchy) { try{hierarchy.delete();}catch(e){} hierarchy = null; }
        if(cap) { try{if(typeof cap.delete === 'function') cap.delete();}catch(e){} cap = null; }
        
        let ctx = document.getElementById('canvasOutput').getContext('2d');
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        
        enableUI(false);
        updateStartButtons(false);
        
        statusBadge.innerText = "IDLE";
        statusBadge.className = "text-[10px] text-[#8ab4f8] font-mono border border-[#8ab4f8]/30 px-1.5 py-0.5 rounded";
    }

    function enableUI(enabled) {
        toggleScanBtn.disabled = !enabled;
        camPlaceholder.style.display = enabled ? 'none' : 'flex';
    }

    function initCvObjects() {
        if(!streaming) return;
        let width = video.videoWidth;
        let height = video.videoHeight;
        video.width = width;
        video.height = height;
        let canvas = document.getElementById('canvasOutput');
        canvas.width = width;
        canvas.height = height;

        src = new cv.Mat(height, width, cv.CV_8UC4);
        dst = new cv.Mat(height, width, cv.CV_8UC1);
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();
        cap = new cv.VideoCapture(video);

        requestAnimationFrame(processVideoFrame);
    }

    function processVideoFrame() {
        if (!streaming) return;
        try {
            if(!cap) return;
            cap.read(src);
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
            cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            cv.Canny(dst, dst, parseInt(sliderT1.value), parseInt(sliderT2.value), 3, false);
            cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let minArea = 100;
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                if(cnt) {
                    if (cv.contourArea(cnt) > minArea) {
                        cv.drawContours(src, contours, i, new cv.Scalar(138, 180, 248, 255), 2, cv.LINE_8, hierarchy, 0); 
                    }
                    cnt.delete(); 
                }
            }
            cv.imshow('canvasOutput', src);
        } catch (e) { console.log("Stream loop error"); }
        requestAnimationFrame(processVideoFrame);
    }

    // --- Live Scanning / Printing Logic ---

    toggleScanBtn.addEventListener('click', () => {
        if(isScanning) stopScanning();
        else startScanning();
    });

    function startScanning() {
        if(!streaming) return alert("Please start camera source first.");
        
        // --- VIDEO REPLAY ---
        if(isVideoFile) {
            if (video.paused || video.ended) {
                video.currentTime = 0;
                video.play();
            }
        }
        
        // Reset State
        isScanning = true;
        baseGenerated = false; 
        consecutiveEmptyLayers = 0;
        lastValidPolygon = null;
        gcodeMoves = [];
        drawCount = 0;
        totalTimeSeconds = 0;
        totalFilamentMM = 0;
        currentZ = 0;
        currentLayer = 0;
        
        if(livePrintMesh) livePrintMesh.geometry.setDrawRange(0, 0);
        zDisplay.innerText = "0.0";
        updateStatsUI();
        nozzleMesh.position.set(0,0,0);

        toggleScanBtn.innerHTML = `<span>STOP BUILD</span>`;
        toggleScanBtn.classList.add('border-[#f28b82]', 'text-[#f28b82]');
        toggleScanBtn.classList.remove('border-gray-600', 'text-[#8ab4f8]');
        
        // Show live status overlay (Now it's global so it works on any tab)
        liveStatus.style.display = 'flex';
        document.getElementById('emptyState').style.display = 'none';

        let speed = parseInt(document.getElementById('scanSpeed').value);
        scanIntervalId = setInterval(processOneLayer, speed);
    }

    function generateBaseFromPoly(polygon) {
        // (Logic identical to previous version, simplified for brevity in this adaptation)
        const nozzle = parseFloat(document.getElementById('nozzleDia').value);
        const layerH = parseFloat(document.getElementById('layerHeight').value);
        const baseLayers = 3; 
        const spacing = nozzle * 1.25; 
        
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        polygon.forEach(p => {
            if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
            if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
        });

        let baseMoves = [];

        function getIntersections(val, isHorizontal) {
            let intersections = [];
            for (let i = 0; i < polygon.length; i++) {
                let p1 = polygon[i];
                let p2 = polygon[(i + 1) % polygon.length];
                let v1 = isHorizontal ? p1.y : p1.x;
                let v2 = isHorizontal ? p2.y : p2.x;
                if (((v1 <= val) && (v2 > val)) || ((v1 > val) && (v2 <= val))) {
                    let t = (val - v1) / (v2 - v1);
                    let intVal = isHorizontal ? p1.x + t * (p2.x - p1.x) : p1.y + t * (p2.y - p1.y);
                    intersections.push(intVal);
                }
            }
            return intersections.sort((a, b) => a - b);
        }

        for(let l=1; l<=baseLayers; l++) {
            let z = l * layerH;
            if(polygon.length > 0) {
                baseMoves.push({ type: 'G0', x: polygon[0].x, y: polygon[0].y, z: z });
                for(let i=1; i<polygon.length; i++) {
                    baseMoves.push({ type: 'G1', x: polygon[i].x, y: polygon[i].y, z: z });
                    add3DLine(polygon[i-1], polygon[i], true, 'base');
                }
                baseMoves.push({ type: 'G1', x: polygon[0].x, y: polygon[0].y, z: z });
                add3DLine(polygon[polygon.length-1], polygon[0], true, 'base');
            }

            let isHorizontal = (l % 2 !== 0); 
            let startVal = (isHorizontal ? minY : minX) + spacing;
            let endVal = (isHorizontal ? maxY : maxX) - spacing;

            for (let val = startVal; val <= endVal; val += spacing) {
                let intersects = getIntersections(val, isHorizontal);
                for (let i = 0; i < intersects.length - 1; i += 2) {
                    let pStart = isHorizontal ? { x: intersects[i], y: val } : { x: val, y: intersects[i] };
                    let pEnd = isHorizontal ? { x: intersects[i+1], y: val } : { x: val, y: intersects[i+1] };
                    
                    baseMoves.push({ type: 'G0', x: pStart.x, y: pStart.y, z: z });
                    baseMoves.push({ type: 'G1', x: pEnd.x, y: pEnd.y, z: z });
                    add3DLine(pStart, pEnd, true, 'base');
                }
            }
            currentZ = z;
        }
        
        gcodeMoves.push(...baseMoves);
        updateEstimates(baseMoves);
        currentZ += layerH;
    }

    function stopScanning() {
        isScanning = false;
        clearInterval(scanIntervalId);
        
        if(isVideoFile && streaming && !video.ended) { video.pause(); }
        
        toggleScanBtn.innerHTML = `<span>START BUILD</span>`;
        toggleScanBtn.classList.remove('border-[#f28b82]', 'text-[#f28b82]');
        toggleScanBtn.classList.add('border-gray-600', 'text-[#8ab4f8]');
        
        setTimeout(() => liveStatus.style.display = 'none', 1000);
    }

    function updateEstimates(newMoves) {
        // Simplified calculation for demo
        const printSpeedSec = 1500 / 60; 
        const travelSpeedSec = 3000 / 60;
        let lastPos = gcodeMoves.length > newMoves.length ? gcodeMoves[gcodeMoves.length - newMoves.length - 1] : {x:0,y:0,z:0};

        newMoves.forEach(m => {
            let dist = Math.hypot(m.x - (lastPos.x||0), m.y - (lastPos.y||0));
            totalTimeSeconds += (dist / (m.type === 'G0' ? travelSpeedSec : printSpeedSec));
            if(m.type !== 'G0') totalFilamentMM += (dist * 0.05); // Rough approx
            lastPos = m;
        });
        updateStatsUI();
    }

    function updateStatsUI() {
        let m = Math.floor(totalTimeSeconds / 60);
        let s = Math.floor(totalTimeSeconds % 60);
        estTimeDisplay.innerText = `${m}m ${s}s`;
    }

    function processOneLayer() {
        if(!isScanning || !contours) return;

        const maxH = parseFloat(document.getElementById('modelHeight').value);
        const layerH = parseFloat(document.getElementById('layerHeight').value);
        const bedSize = parseFloat(document.getElementById('targetWidth').value); 
        const mode = modeSelect.value;
        const textureFactor = parseFloat(sliderTex.value);

        if (currentZ === 0) currentZ = layerH;
        if (currentZ > maxH) { stopScanning(); return; }

        let layerPoints = [];

        // --- MODE 1: CYLINDER (VASE) ---
        if (mode === 'CYLINDER') {
            const numSegments = 60; 
            const maxRadius = bedSize / 2; 
            const baseRadius = Math.max(10, maxRadius - 40.0); 
            const center = { x: video.width / 2, y: video.height / 2 };
            let radii = new Array(numSegments).fill(0); 
            let activePoints = 0; let totalDist = 0;

            if (contours.size() > 0) {
                 for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    if(cnt) {
                        const data = cnt.data32S;
                        if(data) {
                            for (let j = 0; j < data.length; j += 2) {
                                let dx = data[j] - center.x;
                                let dy = data[j+1] - center.y;
                                let dist = Math.sqrt(dx*dx + dy*dy);
                                totalDist += dist; activePoints++;
                                let angle = Math.atan2(dy, dx); 
                                if(angle < 0) angle += Math.PI * 2;
                                let bin = Math.floor((angle / (Math.PI * 2)) * numSegments) % numSegments;
                                let normDist = dist / (video.width/2);
                                if(normDist > radii[bin]) radii[bin] = normDist;
                            }
                        }
                        cnt.delete(); 
                    }
                 }
            }

            let layerThicknessOffset = activePoints > 0 ? (totalDist/activePoints)/(video.width/2) * 20.0 : 0;

            for (let i = 0; i <= numSegments; i++) {
                let idx = i % numSegments;
                let angle = (i / numSegments) * Math.PI * 2;
                let r = baseRadius + layerThicknessOffset + (radii[idx] * textureFactor * 5.0); 
                r = Math.min(r, maxRadius - 2);
                layerPoints.push({ x: (bedSize / 2) + (Math.cos(angle) * r), y: (bedSize / 2) + (Math.sin(angle) * r) });
            }
        } 
        // --- MODE 2: SHAPE SCAN ---
        else {
             let bestPoly = null; let maxArea = 0;
             if(contours.size() > 0) {
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    if(cnt) {
                        let area = cv.contourArea(cnt);
                        if (area > 100 && area > maxArea) {
                            maxArea = area;
                            let tempPoly = [];
                            const data = cnt.data32S;
                            for (let j = 0; j < data.length; j += 2) tempPoly.push({ x: data[j], y: data[j+1] });
                            bestPoly = tempPoly;
                        }
                        cnt.delete();
                    }
                }
            }
            
            if (!bestPoly && lastValidPolygon && consecutiveEmptyLayers < EMPTY_LAYER_THRESHOLD) {
                bestPoly = lastValidPolygon;
            }

            if (bestPoly) {
                lastValidPolygon = bestPoly; 
                consecutiveEmptyLayers = 0; 
                let scaleFactor = bedSize / video.videoWidth; 
                const centerX = bedSize / 2;
                const centerY = (video.videoHeight * scaleFactor) / 2; 
                const maxR = (bedSize / 2) - 5; 
                
                layerPoints = bestPoly.map(p => {
                    let relX = (p.x * scaleFactor) - centerX;
                    let relY = (p.y * scaleFactor) - centerY; 
                    let dist = Math.sqrt(relX*relX + relY*relY);
                    if(dist > maxR) { let ratio = maxR / dist; relX *= ratio; relY *= ratio; }
                    return { x: (bedSize / 2) + relX, y: (bedSize / 2) - relY };
                });
                if(layerPoints.length > 0) layerPoints.push({x: layerPoints[0].x, y: layerPoints[0].y}); // Close Loop
            }
        }

        const isEmpty = layerPoints.length === 0;

        if (!isEmpty || mode === 'CYLINDER') {
            if(document.getElementById('genBase').checked && !baseGenerated) {
                generateBaseFromPoly(layerPoints);
                baseGenerated = true;
            }
            
            consecutiveEmptyLayers = 0;
            let layerMoves = [];
            
            if(layerPoints.length > 0) {
                let start = layerPoints[0];
                layerMoves.push({ type: 'G0', x: start.x, y: start.y, z: currentZ });
                for(let i=1; i<layerPoints.length; i++) {
                    let p = layerPoints[i];
                    layerMoves.push({ type: 'G1', x: p.x, y: p.y, z: currentZ });
                    add3DLine({x:layerPoints[i-1].x, y:layerPoints[i-1].y, z:currentZ}, {x:p.x, y:p.y, z:currentZ}, true, 'wall');
                }
            }
            gcodeMoves.push(...layerMoves);
            updateEstimates(layerMoves);
            
            if(layerMoves.length > 0) {
                let last = layerMoves[layerMoves.length-1];
                nozzleMesh.position.set(last.x, last.y, last.z);
            }
            currentZ += layerH;
            currentLayer++;
            zDisplay.innerText = currentZ.toFixed(1);

        } else {
            consecutiveEmptyLayers++;
            if(consecutiveEmptyLayers > EMPTY_LAYER_THRESHOLD) stopScanning();
        }
    }

    // --- Three.js ---

    function initThreeJS() {
        const container = document.getElementById('canvas3d-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color('#000000');
        scene.fog = new THREE.Fog('#000000', 100, 2000); 

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
        camera.position.set(0, -120, 100);
        camera.up.set(0, 0, 1);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;

        const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 0.4);
        scene.add(hemi);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, -50, 100);
        scene.add(dirLight);

        gridHelper = new THREE.GridHelper(220, 22, 0x555555, 0x222222); 
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
        
        const nozzleGeo = new THREE.SphereGeometry(1.5, 8, 8); 
        const nozzleMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
        nozzleMesh = new THREE.Mesh(nozzleGeo, nozzleMat);
        scene.add(nozzleMesh);

        initDynamicGeometry();
        initBoundsHelper();
        setTimeout(updateSceneDimensions, 200);

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    function initBoundsHelper() {
        const w = parseFloat(document.getElementById('targetWidth').value);
        const h = parseFloat(document.getElementById('modelHeight').value);
        const geometry = new THREE.BoxGeometry(w, w, h);
        geometry.translate(w/2, w/2, h/2); 
        const edges = new THREE.EdgesGeometry(geometry);
        boundsBox = new THREE.LineSegments(edges, new THREE.LineBasicMaterial( { color: 0x888888, transparent: true, opacity: 0.3 } ));
        scene.add(boundsBox);
    }

    window.updateSceneDimensions = function() {
        const w = parseFloat(document.getElementById('targetWidth').value);
        const h = parseFloat(document.getElementById('modelHeight').value);
        if(boundsBox) {
            boundsBox.geometry.dispose();
            const geometry = new THREE.BoxGeometry(w, w, h);
            geometry.translate(w/2, w/2, h/2);
            boundsBox.geometry = new THREE.EdgesGeometry(geometry);
        }
        if(gridHelper) {
            scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(Math.max(w*1.5, 220), 22, 0x555555, 0x222222);
            gridHelper.rotation.x = Math.PI / 2;
            gridHelper.position.set(w/2, w/2, 0);
            scene.add(gridHelper);
        }
        fitView();
    }
    
    window.fitView = function() {
        if(!camera || !controls) return;
        const w = parseFloat(document.getElementById('targetWidth').value);
        const h = parseFloat(document.getElementById('modelHeight').value);
        const center = new THREE.Vector3(w/2, w/2, h/2);
        const size = Math.max(w, h);
        const dist = size * 1.5;
        camera.position.copy(center).add(new THREE.Vector3(0, -dist, dist * 0.8));
        controls.target.copy(center);
        controls.update();
    }

    function initDynamicGeometry() {
        const geometry = new THREE.BufferGeometry();
        linePositions = new Float32Array(MAX_POINTS * 3);
        lineColors = new Float32Array(MAX_POINTS * 3);
        geometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        geometry.setDrawRange(0, 0);
        const material = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2, transparent: true, opacity: 0.9 });
        livePrintMesh = new THREE.LineSegments(geometry, material);
        livePrintMesh.frustumCulled = false; 
        scene.add(livePrintMesh);
    }

    function add3DLine(p1, p2, isExtrude, type = 'wall') {
        if (drawCount + 2 >= MAX_POINTS) return; 
        if (!isExtrude) return; 

        linePositions[drawCount * 3] = p1.x;
        linePositions[drawCount * 3 + 1] = p1.y;
        linePositions[drawCount * 3 + 2] = p1.z;
        linePositions[drawCount * 3 + 3] = p2.x;
        linePositions[drawCount * 3 + 4] = p2.y;
        linePositions[drawCount * 3 + 5] = p2.z;

        let col = type === 'base' ? {r:0.30, g:0.69, b:0.31} : {r:0.54, g:0.70, b:0.97};
        
        for(let i=0; i<2; i++) { 
            lineColors[(drawCount + i) * 3] = col.r;
            lineColors[(drawCount + i) * 3 + 1] = col.g;
            lineColors[(drawCount + i) * 3 + 2] = col.b;
        }
        drawCount += 2;
        livePrintMesh.geometry.setDrawRange(0, drawCount);
        livePrintMesh.geometry.attributes.position.needsUpdate = true;
        livePrintMesh.geometry.attributes.color.needsUpdate = true;
    }

    window.resetApp = function() {
        stopScanning();
        drawCount = 0;
        currentZ = 0;
        currentLayer = 0;
        gcodeMoves = [];
        livePrintMesh.geometry.setDrawRange(0, 0);
        zDisplay.innerText = "0.0";
        totalTimeSeconds = 0; totalFilamentMM = 0;
        updateStatsUI();
        document.getElementById('emptyState').style.display = 'flex';
        nozzleMesh.position.set(0,0,0);
        lastValidPolygon = null;
        liveStatus.style.display = 'none'; // Hide overlay on reset
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        const container = document.getElementById('canvas3d-container');
        // Check if visible (important for mobile tabs)
        if(container.offsetParent === null) return;
        
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.exportGcode = function() {
        if(gcodeMoves.length === 0) return alert("No model generated yet.");
        const txt = [
            ";--G-GEN MOBILE EXPORT--",
            "M140 S60", "M104 S200", "G28", "G92 E0", "G1 Z2.0 F3000",
            "G1 X0.1 Y20 Z0.3 F5000.0", "G1 X0.1 Y200.0 Z0.3 F1500.0 E15", "G92 E0",
            "M82"
        ];
        
        const layerH = parseFloat(document.getElementById('layerHeight').value); 
        const filDia = 1.75;
        const ePerMM = ((0.5 * layerH) / (Math.PI * Math.pow(filDia / 2, 2))) * 1.5;
        
        let e = 0;
        let lastPos = {x:0, y:0};
        
        gcodeMoves.forEach((m, index) => {
            if(m.type === 'G0') {
                if (index > 0) txt.push(`G1 F2400 E${(e - 4.0).toFixed(4)}`);
                txt.push(`G0 F3000 X${m.x.toFixed(3)} Y${m.y.toFixed(3)} Z${m.z.toFixed(3)}`);
                if (index > 0) txt.push(`G1 F2400 E${e.toFixed(4)}`);
            } else {
                let dist = Math.hypot(m.x - lastPos.x, m.y - lastPos.y);
                e += dist * ePerMM;
                txt.push(`G1 F1500 X${m.x.toFixed(3)} Y${m.y.toFixed(3)} Z${m.z.toFixed(3)} E${e.toFixed(4)}`);
            }
            lastPos = {x:m.x, y:m.y};
        });
        
        txt.push("G91", "G1 F1800 E-3", "G1 Z20", "G90", "M104 S0", "M140 S0", "M84");
        const blob = new Blob([txt.join('\n')], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "vision_scan.gcode";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
</script>
